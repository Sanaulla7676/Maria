<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Secure checkout for Maria Perfumes"><title>Checkout | Maria Perfumes</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>MP</span><b>MARIA PERFUMES</b></a><div class="checkout-lock">Secure checkout</div></header><main class="container checkout"><section><span class="kicker">CHECKOUT</span><h1>Complete your order.</h1><form id="checkoutForm" class="checkout-form"><label>Full name<input required name="name" autocomplete="name"></label><label>Email<input required type="email" name="email" autocomplete="email"></label><label>Phone<input required type="tel" name="phone" autocomplete="tel"></label><label>Delivery address<textarea required name="address" rows="4" autocomplete="street-address"></textarea></label><label>City<input required name="city" value="Bengaluru" autocomplete="address-level2"></label><div class="notice">Payment gateway integration is intentionally server-side. Do not place secret payment keys in this page.</div><button class="button primary wide" type="submit">Place order securely</button></form></section><aside class="order-summary"><h2>Order summary</h2><div id="summary"></div><div class="summary-total"><span>Total</span><strong id="total">₹0</strong></div></aside></main><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const items=cartItems();document.querySelector('#summary').innerHTML=items.map(x=>'<div class="summary-row"><span>'+x.product.name+' × '+x.qty+'</span><strong>₹'+(x.product.price*x.qty).toLocaleString('en-IN')+'</strong></div>').join('')||'<p>Your bag is empty.</p>';document.querySelector('#total').textContent=money(cartTotal());document.querySelector('#checkoutForm').addEventListener('submit',e=>{e.preventDefault();if(!items.length)return alert('Add a fragrance before checkout.');alert('Order details captured. Connect this form to your server-side payment/order endpoint before accepting live payments.');});});</script></body></html>
