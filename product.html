<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Maria Perfumes product detail"><title>Fragrance | Maria Perfumes</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>MP</span><b>MARIA PERFUMES</b></a><nav><a href="shop.html">Shop</a><a href="events.html">Events</a><a href="about.html">Our Story</a></nav><button data-cart-open class="bag">Bag <span data-cart-count>0</span></button></header><main id="productPage" class="container product-page"></main><aside id="cartDrawer" class="cart-drawer" data-open="false"><div id="cartBackdrop"></div><div class="cart-panel"><div class="cart-head"><h2>Your bag</h2><button data-cart-close>×</button></div><div id="cartItems" class="cart-items"></div><div class="cart-foot"><div><span>Subtotal</span><strong id="cartSubtotal">₹0</strong></div><a class="button primary" href="checkout.html">Send order request</a></div></div></aside><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const id=new URLSearchParams(location.search).get('id')||'maria-noir';const p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];if(!p)return;document.title=p.name+' | Maria Perfumes';const variants=p.variants.map(v=>'<option value="'+v.id+'">'+v.label+' · '+money(v.price)+' · '+v.stock+' available</option>').join('');document.querySelector('#productPage').innerHTML='<a class="back" href="shop.html">← Back to collection</a><div class="product-detail"><div class="detail-media">'+productImage(p)+'</div><div class="detail-copy"><span class="kicker">'+p.category+' · '+p.family+'</span><h1>'+p.name+'</h1><div class="detail-rating">★ '+p.rating+' · '+p.reviews+' reviews</div><p class="lead">'+p.description+'</p><div class="note-list">'+p.notes.map(n=>'<span>'+n+'</span>').join('')+'</div><label class="variant-select">Variant<select id="variantSelect">'+variants+'</select></label><div id="detailPrice" class="price">'+money(p.variants[0].price)+' <small>'+p.variants[0].label+'</small></div><button id="addProduct" class="button primary wide">Add to bag</button><div class="detail-points"><div><b>Owner-managed catalogue</b><span>Availability and prices are maintained from the private dashboard.</span></div><div><b>Order request only</b><span>No online payment is collected at checkout.</span></div><div><b>Visit the store</b><span>Maria Perfumes · Kammanahalli, Bengaluru.</span></div></div></div></div>';const select=document.querySelector('#variantSelect');const sync=()=>{const v=p.variants.find(x=>x.id===select.value)||p.variants[0];document.querySelector('#detailPrice').innerHTML=money(v.price)+' <small>'+v.label+' · '+v.stock+' available</small>'};select.addEventListener('change',sync);document.querySelector('#addProduct').addEventListener('click',()=>addToCart(p.id,select.value));sync();boot();});</script></body></html>
