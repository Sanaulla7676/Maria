<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Maria Perfumes product detail"><title>Fragrance | Maria Perfumes</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>MP</span><b>MARIA PERFUMES</b></a><nav><a href="shop.html">Shop</a><a href="events.html">Events</a><a href="about.html">Our Story</a></nav><button data-cart-open class="bag">Bag <span data-cart-count>0</span></button></header><main id="productPage" class="container product-page"></main><aside id="cartDrawer" class="cart-drawer" data-open="false"><div id="cartBackdrop"></div><div class="cart-panel"><div class="cart-head"><h2>Your bag</h2><button data-cart-close>×</button></div><div id="cartItems" class="cart-items"></div><div class="cart-foot"><div><span>Subtotal</span><strong id="cartSubtotal">₹0</strong></div><a class="button primary" href="checkout.html">Secure checkout</a></div></div></aside><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const id=new URLSearchParams(location.search).get('id')||'maria-noir';const p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];document.title=p.name+' | Maria Perfumes';document.querySelector('#productPage').innerHTML='<a class="back" href="shop.html">← Back to collection</a><div class="product-detail"><div class="detail-media"><img src="'+p.image+'" alt="'+p.name+' perfume bottle"></div><div class="detail-copy"><span class="kicker">'+p.category+' · '+p.family+'</span><h1>'+p.name+'</h1><div class="detail-rating">★ '+p.rating+' · '+p.reviews+' reviews</div><p class="lead">'+p.description+'</p><div class="note-list">'+p.notes.map(n=>'<span>'+n+'</span>').join('')+'</div><div class="price">₹'+p.price.toLocaleString('en-IN')+' <small>'+p.size+'ml</small></div><button class="button primary wide" data-add="'+p.id+'">Add to bag</button><div class="detail-points"><div><b>Authentic presentation</b><span>Every order prepared with care.</span></div><div><b>Store pickup</b><span>Visit Maria Perfumes in Kammanahalli.</span></div><div><b>Gift-ready</b><span>Ask about fragrance gifting and event orders.</span></div></div></div></div>';document.querySelector('[data-add]').onclick=()=>addToCart(p.id);boot();});</script></body></html>
