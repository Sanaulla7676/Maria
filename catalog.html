<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maria Signature Perfumes</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>MP</span><b>MARIA PERFUMES</b></a><nav><a href="index.html">Home</a><a class="active" href="catalog.html">Signature Perfumes</a><a href="events.html">Events</a><a href="about.html">Our Story</a></nav><a class="bag" href="shop.html">Shop <span data-cart-count>0</span></a></header><main class="container shop-page"><div class="page-intro"><div><span class="kicker">MARIA SIGNATURE</span><h1>Fragrance Intelligence.</h1><p>40% concentration · pure oil format · designed for up to 12 hours of wear with good projection.</p></div><div class="shop-controls"><input id="q" placeholder="Search fragrance..."><select id="gender"><option value="all">All</option><option>Men</option><option>Women</option><option>Unisex</option></select></div></div><div class="results-line"><span id="count"></span><span>30 ml ₹600 · 50 ml ₹1,000 · 100 ml ₹1,800</span></div><div id="grid" class="product-grid"></div></main><script src="maria-catalog.js"></script><script>const grid=document.querySelector('#grid'),q=document.querySelector('#q'),g=document.querySelector('#gender'),count=document.querySelector('#count');function render(){const x=MARIA_PRODUCTS.filter(p=>`${p.displayName} ${p.family} ${p.notes.join(' ')}`.toLowerCase().includes(q.value.toLowerCase())&&(g.value==='all'||p.gender===g.value));count.textContent=`${x.length} fragrances`;grid.innerHTML=x.map(p=>`<article class="product-card"><a class="product-media" href="product-reference.html?id=${p.id}"><div class="image-placeholder"><span>${p.displayName}</span><small>Open fragrance profile</small></div></a><div class="product-copy"><div class="eyebrow">${p.family} · ${p.gender}</div><h3>${p.displayName}</h3><p>${p.mainAccords.join(' · ')}</p><div class="product-row"><strong>₹600</strong><a class="add-btn" href="product-reference.html?id=${p.id}">Explore</a></div><div class="rating">★ ${p.rating}</div></div></article>`).join('')}q.addEventListener('input',render);g.addEventListener('change',render);render();</script></body></html>
