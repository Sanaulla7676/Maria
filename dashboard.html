<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard | Maria Perfumes</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="dashboard.css"></head><body class="dashboard-body"><div id="loginGate" class="login-gate"><div class="login-card"><span class="kicker">PRIVATE AREA</span><h1>Owner access</h1><p>Manage products, images, variants, stock, prices and incoming customer orders from one place.</p><form id="loginForm"><label>Owner PIN<input id="ownerPin" type="password" inputmode="numeric" minlength="4" required placeholder="Enter PIN"></label><button class="button primary wide">Open dashboard</button></form><small>First visit uses PIN <b>2468</b>. Change it from Settings.</small></div></div><div id="dashboardApp" class="dashboard-shell hidden"><aside class="dashboard-sidebar"><a class="brand dashboard-brand" href="index.html"><span>MP</span><b>MARIA OWNER</b></a><nav><button class="nav-tab active" data-tab="overview">Overview</button><button class="nav-tab" data-tab="orders">Orders</button><button class="nav-tab" data-tab="bookings">Event enquiries</button><button class="nav-tab" data-tab="products">Products</button><button class="nav-tab" data-tab="settings">Settings</button></nav><button id="logoutBtn" class="sidebar-logout">Log out</button></aside><main class="dashboard-main"><header class="dashboard-top"><div><span class="kicker">OWNER CONSOLE</span><h1 id="pageTitle">Overview</h1></div><a class="button secondary" href="index.html">View storefront</a></header><section id="tab-overview" class="dash-tab active"></section><section id="tab-orders" class="dash-tab"></section><section id="tab-bookings" class="dash-tab"></section><section id="tab-products" class="dash-tab"></section><section id="tab-settings" class="dash-tab"></section></main></div><div id="productModal" class="dash-modal" hidden><div class="modal-card"><div class="modal-head"><h2 id="productModalTitle">Add product</h2><button data-close-modal>×</button></div><form id="productForm" class="admin-form"><input type="hidden" name="id"><label>Product name<input name="name" required></label><div class="form-grid"><label>Category<input name="category" placeholder="Eau de Parfum" required></label><label>Gender<input name="gender" placeholder="Unisex"></label><label>Family<input name="family" placeholder="Woody Amber"></label><label>Badge<input name="badge" placeholder="Bestseller"></label></div><label>Description<textarea name="description" rows="3"></textarea></label><label>Notes<input name="notes" placeholder="Oud, Amber, Sandalwood"></label><div class="image-upload-row"><div id="imagePreview" class="admin-image-preview"><span>IMAGE PLACEHOLDER</span><small>Upload from your computer</small></div><label>Product image<input id="productImage" type="file" accept="image/*"></label></div><div><div class="variant-head"><h3>Variants</h3><button type="button" class="button secondary" id="addVariantBtn">Add variant</button></div><div id="variantRows"></div></div><div class="form-grid"><label>Rating<input name="rating" type="number" step="0.1" min="0" max="5" value="5"></label><label>Reviews<input name="reviews" type="number" min="0" value="0"></label><label><span>Active</span><input name="active" type="checkbox" checked></label><label><span>Featured</span><input name="featured" type="checkbox"></label></div><div class="modal-actions"><button type="button" class="button secondary" data-close-modal>Cancel</button><button class="button primary">Save product</button></div></form></div></div><script src="dashboard.js"></script></body></html>
