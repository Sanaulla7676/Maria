<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maria Perfumes · Fragrance Intelligence</title>
<style>
:root{--bg:#efe8e0;--panel:#fbf8f4;--ink:#2b2627;--muted:#867d79;--line:#ddd4cb;--accent:#d85a16;--brown:#82511b;--rose:#8e5448;--blue:#92c9f0;--night:#70727a;--gold:#d1a13c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif} .wrap{max-width:1320px;margin:auto;padding:30px 34px 56px}.top{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}.brand{font-size:clamp(36px,5vw,68px);font-family:Georgia,serif;line-height:.98;letter-spacing:-.05em}.sub{font-size:15px;color:var(--muted);margin-top:8px}.grid{display:grid;grid-template-columns:420px 1fr;gap:34px;margin-top:32px}.left,.right{min-width:0}.product-img{aspect-ratio:1/1.12;background:linear-gradient(145deg,#e8dfd6,#d1c3b6);display:grid;place-items:center;border-radius:18px;overflow:hidden}.product-img img{width:100%;height:100%;object-fit:cover}.placeholder{font-family:Georgia,serif;font-size:30px;letter-spacing:.12em;text-align:center;color:#6f5c51}.rating{font-size:42px;font-weight:700;margin-top:24px}.stars{font-size:26px;color:#e8b31b;letter-spacing:1px}.reviews{font-size:16px;color:var(--muted);margin-left:4px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 7px 24px rgba(57,40,35,.06)}.label{font-size:18px;color:#a89d98;margin-bottom:10px}.bars{display:grid;gap:10px}.bar{height:56px;border-radius:9px;color:#fff;display:flex;align-items:center;padding:0 18px;font-size:25px}.bar:nth-child(1){background:#d83f0b}.bar:nth-child(2){background:#80511b}.bar:nth-child(3){background:#8b5044}.bar:nth-child(4){background:#c72f08}.bar:nth-child(5){background:#bf530d}.profile{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff;border:1px solid #e2dbd3;border-radius:10px;padding:14px;font-size:23px}.metric span{font-size:14px;color:var(--muted);margin-left:8px}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.note{background:#fff;border:1px solid #e2dbd3;border-radius:12px;padding:10px}.note-img{aspect-ratio:1;border-radius:9px;background:linear-gradient(145deg,#6c3f1e,#d9b788);display:grid;place-items:center;color:white;font-size:12px;text-align:center}.note-name{font-size:17px;margin-top:8px}.seg{display:grid;grid-template-columns:1fr 1fr;height:60px;border-radius:9px;overflow:hidden;background:var(--night)}.seg div{display:grid;place-items:center;font-size:22px}.seg .day{background:var(--blue)}.seasons{display:grid;grid-template-columns:1fr 1fr;gap:12px}.season{height:58px;background:#cfd2d8;border-radius:8px;overflow:hidden;position:relative;display:flex;align-items:center;padding:0 16px;font-size:18px}.season i{position:absolute;left:0;top:0;bottom:0;width:24%;opacity:.95}.season span{position:relative;z-index:1}.winter i{background:#69b2ee}.spring i{background:#9cd954}.summer i{background:#ffbd31}.autumn i{background:#e96d31}.buy{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.variant{background:#fff;border:1px solid #ddd4cb;border-radius:12px;padding:17px}.variant b{font-size:20px}.price{display:block;font-size:25px;font-weight:700;margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.btn{border:0;border-radius:10px;padding:16px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:#332324;color:#fff}.secondary{background:#fff;border:1px solid #c7bdb5}.meta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.pill{padding:7px 10px;border-radius:999px;background:#fff;border:1px solid #ded6cf;font-size:12px}.qr{width:108px;height:108px;border:7px solid #fff;box-shadow:0 2px 9px rgba(0,0,0,.15);border-radius:12px;background:repeating-linear-gradient(45deg,#111 0 4px,#fff 4px 8px)}@media(max-width:900px){.wrap{padding:20px 16px 40px}.grid{grid-template-columns:1fr}.notes,.buy{grid-template-columns:repeat(2,1fr)}.profile,.seasons,.actions{grid-template-columns:1fr}.top{grid-template-columns:1fr auto}.qr{width:84px;height:84px}.bar{font-size:19px;height:48px}}@media(max-width:480px){.notes,.buy{grid-template-columns:1fr}.rating{font-size:34px}.notes{gap:10px}}
</style></head>
<body><div class="wrap">
<div class="top"><div><div class="brand" id="name">Oud Wood</div><div class="sub" id="subtitle">Maria Signature · for unisex</div><div class="meta"><span class="pill" id="collection">Signature Perfumes</span><span class="pill" id="concentration">40% concentration</span><span class="pill" id="format">Pure Oil</span></div></div><div class="qr" aria-label="Product QR placeholder"></div></div>
<div class="grid"><section class="left"><div class="product-img"><div class="placeholder" id="imageText">MARIA PERFUMES<br><small>PRODUCT IMAGE</small></div></div><div class="rating"><span id="rating">4.8</span> <span class="stars">★★★★★</span><span class="reviews" id="reviews">(0)</span></div><div class="panel"><div class="label">notes</div><div class="notes" id="notes"></div></div></section>
<section class="right"><div class="panel"><div class="label">main accords</div><div class="bars" id="accords"></div></div><div class="panel"><div class="label">fragrance profile</div><div class="profile"><div class="metric">⌛ <b id="longevity">12 h</b><span>Longevity</span></div><div class="metric">≈ <b id="projection">Good</b><span>Projection</span></div></div></div><div class="panel"><div class="label">day time</div><div class="seg"><div class="day">☀ Day</div><div>🌙 Night</div></div></div><div class="panel"><div class="label">seasons</div><div class="seasons"><div class="season winter"><i></i><span>❄ Winter</span></div><div class="season spring"><i></i><span>🌸 Spring</span></div><div class="season summer"><i></i><span>☀ Summer</span></div><div class="season autumn"><i></i><span>🍂 Autumn</span></div></div></div><div class="panel"><div class="label">choose size</div><div class="buy" id="buy"></div><div class="actions"><button class="btn secondary" type="button" id="add">Add to bag</button><button class="btn primary" type="button" id="buyNow">Buy now</button></div></div></section></div></div>
<script src="maria-catalog.js"></script><script>
const slug=new URLSearchParams(location.search).get('id')||'oud-wood'; const p=MARIA_PRODUCTS.find(x=>x.id===slug)||MARIA_PRODUCTS[0];
document.title=p.displayName+' | Maria Perfumes'; document.getElementById('name').textContent=p.displayName; document.getElementById('subtitle').textContent=`Maria Signature · for ${p.gender.toLowerCase()}`; document.getElementById('collection').textContent=p.collection;document.getElementById('concentration').textContent=p.concentration+'% concentration';document.getElementById('format').textContent=p.format;document.getElementById('rating').textContent=p.rating;document.getElementById('reviews').textContent='('+p.reviews+')';document.getElementById('longevity').textContent=p.longevity;document.getElementById('projection').textContent=p.projection;
document.getElementById('accords').innerHTML=p.mainAccords.map((a,i)=>`<div class="bar" style="filter:hue-rotate(${i*8}deg);width:${100-i*6}%">${a}</div>`).join('');
document.getElementById('notes').innerHTML=p.notes.map(n=>`<div class="note"><div class="note-img">${n}</div><div class="note-name">${n}</div></div>`).join('');
document.getElementById('buy').innerHTML=p.variants.map(v=>`<label class="variant"><input type="radio" name="v" value="${v.id}" ${v===p.variants[0]?'checked':''}> <b>${v.label}</b><span class="price">₹${v.price.toLocaleString('en-IN')}</span></label>`).join('');
document.getElementById('add').onclick=()=>{const v=document.querySelector('input[name=v]:checked')?.value||p.variants[0].id;const key=`${p.id}::${v}`;const cart=JSON.parse(localStorage.getItem('maria-cart')||'{}');cart[key]=(cart[key]||0)+1;localStorage.setItem('maria-cart',JSON.stringify(cart));alert('Added to bag');}; document.getElementById('buyNow').onclick=()=>{const v=document.querySelector('input[name=v]:checked')?.value||p.variants[0].id;location.href=`checkout.html?product=${encodeURIComponent(p.id)}&variant=${encodeURIComponent(v)}`;};
</script></body></html>
